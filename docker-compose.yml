version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinical_kg_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: clinical_kg_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d clinical_kg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clinical_kg_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Clinical Knowledge Graph & Intelligent Document Assistant
      - APP_ENV=production
      - DATABASE_URL=postgresql://postgres:postgrespassword@postgres:5432/clinical_kg_db
      - TOP_K_CHUNKS=4
      - SIMILARITY_THRESHOLD=0.20
      - MAX_GRAPH_HOPS=2
      - LLM_PROVIDER=mock
      - EMBEDDING_PROVIDER=tfidf
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
